name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Version is derived from the tag, in this same job, with no second
      # workflow and no PR to forget — see research/11-upstream-releases.md §5
      # for the upstream failure mode this is designed to avoid. build_zip.py
      # reads this file; it does not know about git tags itself, so deriving
      # the version from GITHUB_REF_NAME stays a CI-only concern here.
      - name: Set version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "$VERSION" > skill/document-design-intelligence/VERSION

      # RELEASE-NOTES.md accumulates one "# vX.Y.Z" section per release, so
      # body_path can't point at the whole file — that would ship every prior
      # version's notes underneath the current one. Extract only the section
      # for this tag and fail the job if it's missing or empty rather than
      # publishing a blank body.
      - name: Extract release notes for this version
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          HEADER="# v$VERSION"
          NOTES_FILE="$RUNNER_TEMP/release-notes-section.md"
          awk -v header="$HEADER" '
            $0 == header { printing=1 }
            printing && /^# v/ && $0 != header { exit }
            printing { print }
          ' RELEASE-NOTES.md > "$NOTES_FILE"
          if [ ! -s "$NOTES_FILE" ] || [ "$(head -n1 "$NOTES_FILE")" != "$HEADER" ]; then
            echo "::error::No release notes section found for '$HEADER' in RELEASE-NOTES.md — refusing to publish an empty or missing release body."
            exit 1
          fi
          echo "path=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      # Single build entry point for both CI and local dev — see the script's
      # own docstring. Validates data (research/09-library-schema.md §4,
      # items 1-4), stamps the version into SKILL.md, and zips with the
      # correct ZIP root. No --allow-empty-data here: a tag with no valid
      # schema-manifest.json must fail closed, producing no artifact, not a
      # broken release (the upstream failure mode in research/11-upstream-releases.md §5).
      - name: Build the skill ZIP
        run: python3 skill/document-design-intelligence/scripts/build_zip.py

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: skill/dist/document-design-intelligence-${{ steps.version.outputs.version }}.zip
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
